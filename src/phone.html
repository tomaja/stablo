<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Phone variant: one person per screen. Ancestors are a trail at the top, children are big rows,
   siblings are a swipe away, and the controls sit in a bottom bar within thumb reach. */
:root {
  --bg: #eef1ec; --surface: #f8faf6; --raise: #ffffff; --ink: #1d2621; --muted: #5f6a63; --faint: #8b958e;
  --line: #d3d9d1; --accent: #8c2a4d; --accent-soft: #8c2a4d1f; --on-accent: #ffffff;
  --c1: #2b6a92; --c2: #3b7d4c; --c3: #a5561c; --c4: #6a4ea3; --c5: #1a8580; --c6: #6d7a24; --c0: #848c86;
  --f-display: "Spectral", "Iowan Old Style", Georgia, serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --bar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #161c19; --raise: #1d2420; --ink: #e5eae4; --muted: #9ba59e; --faint: #6f7972;
    --line: #2a332e; --accent: #e985a9; --accent-soft: #e985a926; --on-accent: #1f0d15;
    --c1: #72b4de; --c2: #7cc58d; --c3: #e59c62; --c4: #ab9ce8; --c5: #5ccbc3; --c6: #bac56c; --c0: #6c756f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #161c19; --raise: #1d2420; --ink: #e5eae4; --muted: #9ba59e; --faint: #6f7972;
  --line: #2a332e; --accent: #e985a9; --accent-soft: #e985a926; --on-accent: #1f0d15;
  --c1: #72b4de; --c2: #7cc58d; --c3: #e59c62; --c4: #ab9ce8; --c5: #5ccbc3; --c6: #bac56c; --c0: #6c756f;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page { max-width: 560px; margin: 0 auto; padding: 0 var(--gutter) calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); }

/* ancestor trail */
.trail {
  position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin: 0 calc(-1 * var(--gutter)); padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter) 10px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); scroll-snap-type: x proximity;
}
.trail::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--raise); font-size: 14px; white-space: nowrap; scroll-snap-align: end;
}
.chip small { font: 12px var(--f-mono); color: var(--muted); }
.chip.here { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.chip.here small { color: inherit; opacity: .8; }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.sep { flex: none; align-self: center; color: var(--faint); font-size: 13px; }

/* person card (swipe left/right for siblings) */
.card { margin-top: 18px; touch-action: pan-y; user-select: none; }
.eyebrow { display: flex; align-items: center; gap: 8px; font: 500 11.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow i { width: 9px; height: 9px; border-radius: 50%; }
h1 { margin: 10px 0 0; font: 500 32px/1.08 var(--f-display); letter-spacing: -0.015em; text-wrap: balance; }
h1 em { font-style: italic; font-weight: 400; color: var(--muted); font-size: .78em; }
.sub { margin: 8px 0 0; color: var(--muted); }
.sub b { font: 500 15px var(--f-mono); color: var(--ink); }
.facts { margin: 16px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; font-size: 15px; }
.facts dt { font: 500 11px/22px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
details.note { margin-top: 14px; border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
details.note summary { cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; }
details.note summary::after { content: " ▾"; }
details.note[open] summary::after { content: " ▴"; }
details.note p { margin: 8px 0 0; overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; margin-top: 16px; }
.btn {
  height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--raise);
  display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;
}

/* sibling stepper */
.sibs { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; margin-top: 20px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 4px; }
.sibs a, .sibs span.off { height: 48px; display: grid; place-items: center; border-radius: 9px; font-size: 22px; color: var(--muted); }
.sibs a:active { background: var(--accent-soft); }
.sibs span.off { opacity: .3; }
.sibs .mid { text-align: center; font-size: 13px; color: var(--muted); line-height: 1.3; min-width: 0; }
.sibs .mid b { display: block; color: var(--ink); font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* lists of people: big tap targets */
.sect { margin-top: 26px; }
.sect h2 { margin: 0 0 8px; display: flex; justify-content: space-between; font: 500 11.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.rows { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--raise); overflow: hidden; }
.rows li + li { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 10px 1fr auto 14px; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; }
.row:active { background: var(--accent-soft); }
.row i { width: 10px; height: 10px; border-radius: 50%; }
.row .nm { min-width: 0; }
.row .nm b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .nm small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .cnt { font: 12.5px var(--f-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row .cnt span { display: block; font-size: 10.5px; color: var(--faint); }
.row svg { color: var(--faint); }
.empty { color: var(--faint); font-size: 14px; margin: 0; }

/* home */
.hero { padding-top: calc(28px + env(safe-area-inset-top, 0px)); }
.hero h1 { font-size: 30px; }
.lede { color: var(--muted); margin: 10px 0 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
.stats b { display: block; font: 500 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 13px; color: var(--muted); }

/* bottom bar: home, up, search */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
}
.bar a, .bar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--muted); }
.bar svg { width: 22px; height: 22px; color: var(--ink); }
.bar .off { opacity: .35; pointer-events: none; }

/* search sheet */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.sheet-h { display: flex; gap: 8px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter) 10px; border-bottom: 1px solid var(--line); }
.sheet-h input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--raise); font-size: 16px; outline: none; }
.sheet-h input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sheet-h button { height: 44px; border: 0; background: none; color: var(--accent); font-weight: 500; padding: 0 4px; }
.sheet-b { overflow: auto; padding: 12px var(--gutter) 24px; flex: 1; }
.sheet-b .count { font: 11px var(--f-mono); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
mark { background: none; color: var(--accent); font-weight: 600; }

.loading { padding: 40vh 0 0; text-align: center; color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.hero .acts { margin-top: 18px; }

/* full-screen tree: the main page's disk in ?view=tree mode */
.treefull { position: fixed; inset: 0; z-index: 40; background: var(--bg); }
.treefull iframe { width: 100%; height: 100%; border: 0; display: block; }
.treefull p { position: absolute; inset: 45% 0 auto; margin: 0; text-align: center; color: var(--muted); }

/* page transitions: forward slides left, back slides right */
@keyframes in-r { from { transform: translateX(28%); opacity: 0; } }
@keyframes out-l { to { transform: translateX(-18%); opacity: 0; } }
@keyframes in-l { from { transform: translateX(-28%); opacity: 0; } }
@keyframes out-r { to { transform: translateX(18%); opacity: 0; } }
::view-transition-old(page) { animation: out-l .22s ease both; }
::view-transition-new(page) { animation: in-r .26s ease both; }
:root[data-dir="back"]::view-transition-old(page) { animation-name: out-r; }
:root[data-dir="back"]::view-transition-new(page) { animation-name: in-l; }
#page { view-transition-name: page; }
@media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
</style>
</head>
<body>
<div class="page" id="page"><p class="loading">Učitavanje rodoslova…</p></div>
<nav class="bar" aria-label="Navigacija">
  <a href="#" id="bHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Početak</a>
  <a href="#" id="bUp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span id="lUp">Roditelj</span></a>
  <button type="button" id="bSearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>Traži</button>
</nav>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-h"><input id="q" type="search" placeholder="Ime, prezime, mesto ili godina" autocomplete="off" spellcheck="false" aria-label="Traži"><button type="button" id="qClose">Zatvori</button></div>
  <div class="sheet-b" id="qRes"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script>
(async () => {
'use strict';
const CFG = __CONFIG__;
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const treeIcon = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><path d="M8 6.4V2M6.6 9 3.5 11.5M9.4 9l3.1 2.5"/></svg>';
const chev = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>';

/* ---------- data (same Supabase table as the main page) ---------- */
async function loadRows() {
  const cols = 'id,ime,nadimak,prezime,rodjen,opis,mesto,supruznik,redosled,izvor,napomena,roditelj_id,brak_id,pol';
  const page = from => sb.from('people').select(cols, from ? {} : { count: 'exact' }).order('id').range(from, from + 999);
  const first = await page(0);
  if (first.error) throw first.error;
  const size = first.data.length, total = first.count ?? size, rest = [];
  for (let from = size; size && from < total; from += size) rest.push(page(from));
  const out = first.data.slice();
  for (const r of await Promise.all(rest)) { if (r.error) throw r.error; out.push(...r.data); }
  return out;
}
let rows;
try { rows = await loadRows(); }
catch (e) { console.error(e); $('page').innerHTML = '<p class="loading">Rodoslov trenutno ne može da se učita.</p>'; return; }

const people = new Map();
for (const r of rows) people.set(r.id, { id: r.id, ime: r.ime || '?', nad: r.nadimak || '', prez: r.prezime || '', god: r.rodjen,
  opis: r.opis || '', mesto: r.mesto || '', sup: r.supruznik || '', izv: r.izvor || '', nap: r.napomena || '', sex: r.pol,
  red: r.redosled || 0, par: r.roditelj_id, brak: r.brak_id, kids: [], spouseOf: [], size: 1, gen: 1 });
for (const p of people.values()) {
  if (p.par != null && people.has(p.par) && p.par !== p.id) people.get(p.par).kids.push(p); else p.par = null;
  if (p.brak != null && people.has(p.brak)) people.get(p.brak).spouseOf.push(p); else p.brak = null;
}
const byOrder = (a, b) => (a.red - b.red) || (a.id - b.id);
for (const p of people.values()) p.kids.sort(byOrder);
const roots = [...people.values()].filter(p => p.par == null);
const walk = (p, g) => { p.gen = g; let s = 1; for (const k of p.kids) s += walk(k, g + 1); return (p.size = s); };
roots.forEach(r => walk(r, 1));
const groups = new Map();
for (const r of roots) { const k = r.prez || '?'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
const groupList = [...groups.entries()].map(([sur, rs]) => ({ sur, rs: rs.sort((a, b) => b.size - a.size || a.id - b.id), size: rs.reduce((s, r) => s + r.size, 0) }))
  .sort((a, b) => b.size - a.size);
const surCount = new Map();
for (const p of people.values()) if (p.prez && p.prez !== '?') surCount.set(p.prez, (surCount.get(p.prez) || 0) + 1);
const topSur = [...surCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(e => e[0]);
const clr = p => `var(--c${topSur.indexOf(p.prez) + 1})`;
const dot = p => `<i style="background:${clr(p)}"></i>`;
const name = p => `${p.ime}${p.nad ? ` „${p.nad}”` : ''} ${p.prez}`;
const yr = y => y == null ? '' : y + '.';

/* ---------- routes: '' home · #s<surname> one family's founders · #p<id> a person ---------- */
const parse = () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h[0] === 'p' && people.has(+h.slice(1))) return { kind: 'p', p: people.get(+h.slice(1)) };
  if (h[0] === 's' && groups.has(h.slice(1))) return { kind: 's', sur: h.slice(1) };
  return { kind: 'home' };
};
const depth = r => r.kind === 'p' ? 1 + r.p.gen : r.kind === 's' ? 1 : 0;
const hrefOf = p => '#p' + p.id;
const founderHref = g => g.rs.length > 1 ? '#s' + encodeURIComponent(g.sur) : hrefOf(g.rs[0]);

function personRow(p, extra, sub) {
  const bits = sub ?? [p.god != null ? yr(p.god) : '', p.opis, p.mesto].filter(Boolean).join(' · ');
  const d = p.size - 1;
  return `<li><a class="row" href="${hrefOf(p)}">${dot(p)}<span class="nm"><b>${esc(name(p))}</b>${bits ? `<small>${esc(bits)}</small>` : ''}</span>
    <span class="cnt">${extra ?? (d ? `+${fmt(d)}<span>potomaka</span>` : '')}</span>${chev}</a></li>`;
}

function viewHome() {
  const years = [...people.values()].map(p => p.god).filter(y => y != null);
  return `<div class="hero"><div class="eyebrow">Porodica</div><h1>${esc(CFG.title)}</h1>
    <p class="lede">Izaberite porodicu, pa idite niz loze dodirom na decu. Preci su uvek u traci na vrhu.</p>
    <div class="stats"><div><b>${fmt(people.size)}</b><span>osoba</span></div><div><b>${roots.length}</b><span>loza</span></div><div><b>${Math.min(...years)}</b><span>najstariji zapis</span></div></div>
    <div class="acts"><button type="button" class="btn primary" data-tree="">${treeIcon}Celo stablo</button></div></div>
    <div class="sect"><h2>Porodice<span>${groupList.length}</span></h2><ul class="rows">${groupList.map(g =>
      `<li><a class="row" href="${founderHref(g)}">${dot(g.rs[0])}<span class="nm"><b>${esc(g.sur)}</b><small>${g.rs.length > 1 ? `${g.rs.length} loza` : `začetnik: ${esc(name(g.rs[0]))}`}</small></span>
        <span class="cnt">${fmt(g.size)}<span>osoba</span></span>${chev}</a></li>`).join('')}</ul></div>`;
}

function viewFamily(sur) {
  const g = groupList.find(x => x.sur === sur);
  return `<nav class="trail" id="trail"><a class="chip" href="#">Početak</a><span class="sep">›</span><span class="chip here">${esc(sur)}</span></nav>
    <div class="card"><div class="eyebrow">${dot(g.rs[0])}Porodica</div><h1>${esc(sur)}</h1><p class="sub">${fmt(g.size)} osoba · ${g.rs.length} loza</p></div>
    <div class="sect"><h2>Začetnici loza<span>${g.rs.length}</span></h2><ul class="rows">${g.rs.map(r => personRow(r)).join('')}</ul></div>`;
}

function viewPerson(p) {
  const anc = []; for (let q = p; q; q = q.par != null ? people.get(q.par) : null) anc.unshift(q);
  const g = groups.get(anc[0].prez || '?');
  const famChip = g && g.length > 1 ? `<a class="chip" href="#s${encodeURIComponent(anc[0].prez || '?')}">${esc(anc[0].prez)}</a><span class="sep">›</span>` : '';
  const trail = `<nav class="trail" id="trail"><a class="chip" href="#" aria-label="Početak">⌂</a><span class="sep">›</span>${famChip}${anc.map(a =>
    a === p ? `<span class="chip here">${esc(a.ime)}${a.god != null ? ` <small>${a.god}</small>` : ''}</span>`
            : `<a class="chip" href="${hrefOf(a)}">${dot(a)}${esc(a.ime)}${a.god != null ? ` <small>${a.god}</small>` : ''}</a><span class="sep">›</span>`).join('')}</nav>`;
  const sibs = p.par != null ? people.get(p.par).kids : (g || [p]);
  const k = sibs.indexOf(p), prev = sibs[k - 1], next = sibs[k + 1];
  const bits = [p.god != null ? `rođ. <b>${esc(yr(p.god))}</b>` : '', esc(p.opis), esc(p.mesto)].filter(Boolean).join(' · ');
  const facts = [];
  if (p.sup) facts.push(['Supružnik', esc(p.sup)]);
  if (p.izv) facts.push(['Izvor', esc(p.izv)]);
  const links = [...(p.brak != null ? [people.get(p.brak)] : []), ...p.spouseOf];
  return `${trail}
    <article class="card" id="card">
      <div class="eyebrow">${dot(p)}${esc(p.prez || 'nepoznato')} · ${p.gen}. generacija</div>
      <h1>${esc(p.ime)}${p.nad ? ` <em>„${esc(p.nad)}”</em>` : ''} ${esc(p.prez)}</h1>
      ${bits ? `<p class="sub">${bits}</p>` : ''}
      ${facts.length ? `<dl class="facts">${facts.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>` : ''}
      ${p.nap ? `<details class="note"${p.nap.length < 140 ? ' open' : ''}><summary>Napomena</summary><p>${esc(p.nap)}</p></details>` : ''}
      <div class="acts"><button type="button" class="btn primary" data-tree="${p.id}">${treeIcon}Pogledaj stablo</button><a class="btn" href="${esc(CFG.fullUrl)}#p${p.id}">Uredi · dodaj dete</a></div>
    </article>
    ${sibs.length > 1 ? `<div class="sibs" aria-label="Braća i sestre">
      ${prev ? `<a href="${hrefOf(prev)}" data-dir="back" aria-label="Prethodni: ${esc(name(prev))}">‹</a>` : '<span class="off">‹</span>'}
      <div class="mid"><b>${p.par != null ? 'Dete' : 'Začetnik'} ${k + 1} od ${sibs.length}</b>prevucite karticu levo ili desno</div>
      ${next ? `<a href="${hrefOf(next)}" aria-label="Sledeći: ${esc(name(next))}">›</a>` : '<span class="off">›</span>'}
    </div>` : ''}
    <div class="sect"><h2>Deca<span>${p.kids.length || ''}</span></h2>${p.kids.length
      ? `<ul class="rows">${p.kids.map(c => personRow(c)).join('')}</ul>` : '<p class="empty">Nema upisane dece.</p>'}</div>
    ${links.length ? `<div class="sect"><h2>Brak u stablu</h2><ul class="rows">${links.map(o => personRow(o, '')).join('')}</ul></div>` : ''}
    ${sibs.length > 1 ? `<div class="sect"><h2>${p.par != null ? 'Braća i sestre' : 'Ostali začetnici'}<span>${sibs.length - 1}</span></h2><ul class="rows">${sibs.filter(s => s !== p).map(s => personRow(s)).join('')}</ul></div>` : ''}`;
}

/* ---------- render + transitions ---------- */
let cur = { kind: 'home' };
function render() {
  const r = parse();
  $('page').innerHTML = r.kind === 'p' ? viewPerson(r.p) : r.kind === 's' ? viewFamily(r.sur) : viewHome();
  document.title = r.kind === 'p' ? `${name(r.p)} · ${CFG.short}` : CFG.title;
  const up = r.kind === 'p' ? (r.p.par != null ? hrefOf(people.get(r.p.par))
    : (groups.get(r.p.prez || '?') || []).length > 1 ? '#s' + encodeURIComponent(r.p.prez) : '#') : '#';
  $('bUp').href = up; $('bUp').classList.toggle('off', r.kind === 'home');
  $('lUp').textContent = r.kind === 'p' && r.p.par != null ? (people.get(r.p.par).sex === 'f' ? 'Majka' : 'Otac') : 'Gore';
  const tr = $('trail'); if (tr) tr.scrollLeft = tr.scrollWidth;
  window.scrollTo(0, 0);
  cur = r;
}
function go() {
  const next = parse();
  document.documentElement.dataset.dir = sideways ? sideways : depth(next) < depth(cur) ? 'back' : 'fwd';
  sideways = null;
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(render);
  else render();
}
let sideways = null;
window.addEventListener('hashchange', go);
$('page').addEventListener('click', e => { const a = e.target.closest('a[data-dir]'); if (a) sideways = a.dataset.dir; });
render();

/* swipe the card sideways for the previous / next sibling */
let sw = null;
$('page').addEventListener('pointerdown', e => { if (e.target.closest('#card')) sw = { x: e.clientX, y: e.clientY }; });
$('page').addEventListener('pointerup', e => {
  if (!sw || cur.kind !== 'p') return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;
  const p = cur.p, sibs = p.par != null ? people.get(p.par).kids : (groups.get(p.prez || '?') || [p]);
  const t = sibs[sibs.indexOf(p) + (dx < 0 ? 1 : -1)];
  if (t) { sideways = dx < 0 ? 'fwd' : 'back'; location.hash = hrefOf(t); }
});

/* ---------- full-screen tree: an overlay with the main page in ?view=tree mode, on its own history entry
   so the phone's back gesture closes it. "Otvori" in the tree comes back here on that person. ---------- */
let treeEl = null, treeToken = 0;
if (history.state && history.state.tree) history.replaceState(null, '');  // left over from a reload while the tree was open
function openTree(id) {
  treeEl = document.createElement('div');
  treeEl.className = 'treefull';
  treeEl.innerHTML = `<p>Učitavanje stabla…</p><iframe title="Stablo" src="${esc(CFG.treeUrl)}?view=tree${id ? '#p' + id : ''}"></iframe>`;
  treeEl.querySelector('iframe').onload = () => { if (treeEl) treeEl.querySelector('p')?.remove(); };
  document.body.appendChild(treeEl);
  document.body.style.overflow = 'hidden';
  treeToken = Date.now();
  history.pushState({ tree: treeToken }, '');
}
function removeTree() {
  if (!treeEl) return;
  treeEl.remove(); treeEl = null; document.body.style.overflow = '';
}
window.addEventListener('popstate', () => { if (treeEl && !(history.state && history.state.tree === treeToken)) removeTree(); });
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !treeEl || !e.data) return;
  if (e.data.type === 'stablo-close') history.back();
  else if (e.data.type === 'stablo-open' && people.has(e.data.id)) {
    removeTree();
    location.replace('#p' + e.data.id);  // takes the tree's history entry, so back returns to where the tree was opened
  }
});
$('page').addEventListener('click', e => {
  const b = e.target.closest('[data-tree]');
  if (b) openTree(b.dataset.tree);
});

/* ---------- search sheet ---------- */
const CYR = { 'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'đ','е':'e','ж':'ž','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'ć','у':'u','ф':'f','х':'h','ц':'c','ч':'č','џ':'dž','ш':'š' };
const fold = s => String(s || '').toLowerCase().replace(/[а-яђјљњћџ]/g, c => CYR[c] || c).replace(/đ/g, 'dj').normalize('NFD').replace(/[̀-ͯ]/g, '');
const index = [...people.values()].map(p => ({ p, hay: fold([p.ime, p.nad, p.prez, p.mesto, p.opis, p.god].join(' ')), ime: fold(p.ime) }));
const q = $('q'), res = $('qRes');
function search() {
  const toks = fold(q.value).split(/\s+/).filter(Boolean);
  if (!toks.length) { res.innerHTML = '<p class="empty">Upišite ime, prezime, mesto ili godinu rođenja.</p>'; return; }
  const out = index.filter(e => toks.every(t => e.hay.includes(t)))
    .map(e => [toks.reduce((s, t) => s + (e.ime === t ? 6 : e.ime.startsWith(t) ? 4 : 1), 0), e.p])
    .sort((a, b) => b[0] - a[0] || (a[1].god ?? 9999) - (b[1].god ?? 9999));
  res.innerHTML = out.length ? `<p class="count">${out.length} ${out.length === 1 ? 'rezultat' : 'rezultata'}</p><ul class="rows">${out.slice(0, 50).map(([, p]) => {
    const par = p.par != null ? people.get(p.par) : null;  // the parent tells namesakes apart
    return personRow(p, p.god != null ? String(p.god) : '', par ? `${par.sex === 'f' ? 'majka' : 'otac'}: ${name(par)}` : 'začetnik loze');
  }).join('')}</ul>` : '<p class="empty">Nema rezultata.</p>';
}
const openSearch = () => { $('sheet').hidden = false; q.focus(); search(); };
const closeSearch = () => { $('sheet').hidden = true; q.blur(); };
$('bSearch').onclick = openSearch;
$('qClose').onclick = closeSearch;
q.addEventListener('input', search);
res.addEventListener('click', e => { if (e.target.closest('a')) closeSearch(); });
})();
</script>
