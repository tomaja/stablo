<title>{{TITLE}}</title>
<script>
// phones get the phone view, unless the full page was asked for (?full=1 from its edit link, ?view=tree for its disk, #admin)
(function (phone) {
  if (phone && !/[?&](full|view)=/.test(location.search) && location.hash !== '#admin' &&
      window.matchMedia && matchMedia('(max-width: 760px)').matches) location.replace(phone + location.hash);
})(__PHONE_URL__);
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Poincaré-disk "trunk cross-section" fills the stage; a reading column (the dossier) sits beside it on desktop and below it on phones. */
:root {
  --bg: #eef1ec;
  --surface: #f8faf6;
  --raise: #ffffff;
  --ink: #1d2621;
  --muted: #5f6a63;
  --faint: #8b958e;
  --line: #d3d9d1;
  --disk: #e4e9e1;
  --ring: #d6ddd3;
  --edge: #6f7a72;
  --accent: #8c2a4d;        /* višnja: selection + ancestor path */
  --accent-soft: #8c2a4d1f;
  --on-accent: #ffffff;
  --alert: #c8231b; --alert-soft: #c8231b26;   /* review: new people without parents */
  --c1: #2b6a92; --c2: #3b7d4c; --c3: #a5561c; --c4: #6a4ea3; --c5: #1a8580; --c6: #6d7a24; --c0: #848c86;
  --f-display: "Spectral", "Iowan Old Style", Georgia, serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --panel-w: 380px;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #161c19; --raise: #1d2420; --ink: #e5eae4; --muted: #9ba59e; --faint: #6f7972;
    --line: #2a332e; --disk: #141a17; --ring: #212925; --edge: #7d887f;
    --accent: #e985a9; --accent-soft: #e985a926; --on-accent: #1f0d15; --alert: #ff6a5c; --alert-soft: #ff6a5c2e;
    --c1: #72b4de; --c2: #7cc58d; --c3: #e59c62; --c4: #ab9ce8; --c5: #5ccbc3; --c6: #bac56c; --c0: #6c756f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #161c19; --raise: #1d2420; --ink: #e5eae4; --muted: #9ba59e; --faint: #6f7972;
  --line: #2a332e; --disk: #141a17; --ring: #212925; --edge: #7d887f;
  --accent: #e985a9; --accent-soft: #e985a926; --on-accent: #1f0d15; --alert: #ff6a5c; --alert-soft: #ff6a5c2e;
  --c1: #72b4de; --c2: #7cc58d; --c3: #e59c62; --c4: #ab9ce8; --c5: #5ccbc3; --c6: #bac56c; --c0: #6c756f;
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* header */
.top {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font: 600 20px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.brand .meta { font: 12px/1.4 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.search { position: relative; flex: 0 1 420px; min-width: 0; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--raise); outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 12px; top: 11px; width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
.search kbd {
  position: absolute; right: 10px; top: 9px; font: 11px/18px var(--f-mono); color: var(--faint);
  border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; pointer-events: none;
}
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
.results {
  position: absolute; z-index: 30; top: 44px; left: 0; right: 0; max-height: min(60vh, 460px); overflow: auto;
  background: var(--raise); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 18px 40px -18px rgba(0,0,0,.35); padding: 6px;
}
.results .count { font: 11px/1 var(--f-mono); color: var(--faint); padding: 6px 8px 8px; text-transform: uppercase; letter-spacing: .06em; }
.res {
  display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 10px; align-items: baseline;
  padding: 7px 8px; border-radius: 7px; cursor: pointer;
}
.res[aria-selected="true"] { background: var(--accent-soft); }
.res .dot { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
.res .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .yr { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.res .ctx { grid-column: 2 / 4; font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res mark { background: none; color: var(--accent); font-weight: 600; }
.noresults { padding: 14px 10px; color: var(--muted); }

.tools { display: flex; gap: 6px; }
.btn {
  height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--raise); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--edge); }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--accent); }
.btn.danger.solid { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.choice { display: grid; gap: 8px; margin: 0; padding: 0; border: 0; min-width: 0; }
.choice label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--raise); }
.choice label:has(input:checked) { border-color: var(--accent); }
.choice input { margin: 3px 0 0; accent-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn .badge { font: 500 11px/18px var(--f-mono); min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--on-accent); text-align: center; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; align-self: flex-start; }
.linkbtn:hover { color: var(--ink); }

/* main */
.main { display: grid; grid-template-columns: 1fr var(--panel-w); min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; display: block; }
.stage canvas.dragging { cursor: grabbing; }
.stage canvas.pointing { cursor: pointer; }

.legend {
  position: absolute; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: min(520px, calc(100% - 120px));
  font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legend i.ln { width: 16px; height: 3px; border-radius: 2px; }
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
/* ?view=tree: only the disk, full screen, with a bar naming the selected person (the phone view opens this) */
.tree-only .top, .tree-only .panel, .tree-only .legend { display: none; }
.tree-only .app, .tree-only .main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.tree-only .zoom { bottom: max(14px, env(safe-area-inset-bottom, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }
.treebar {
  position: absolute; z-index: 6; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(8px); box-shadow: 0 10px 28px -18px rgba(0,0,0,.5);
}
.treebar .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.treebar .nm { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.treebar .nm small { font: 12px var(--f-mono); color: var(--muted); margin-left: 6px; }
.treebar .btn { height: 38px; flex: none; }
.treebar .btn.icon { width: 38px; font-size: 18px; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; max-width: 260px; padding: 8px 10px; border-radius: 8px;
  background: var(--raise); border: 1px solid var(--line); box-shadow: 0 10px 28px -14px rgba(0,0,0,.4); font-size: 12.5px;
}
.tip b { font: 600 14px/1.25 var(--f-display); display: block; }
.tip span { color: var(--muted); }

/* dossier panel */
.panel { border-left: 1px solid var(--line); background: var(--surface); overflow: auto; min-height: 0; overscroll-behavior: contain; }
.panel-in { padding: 22px 22px 32px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { display: flex; align-items: center; gap: 8px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.eyebrow i { width: 9px; height: 9px; border-radius: 50%; }
.name { margin: 0; font: 500 30px/1.1 var(--f-display); letter-spacing: -0.015em; text-wrap: balance; }
.name em { font-style: italic; font-weight: 400; color: var(--muted); font-size: .8em; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.sub .y { font-family: var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pill { font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; margin: 0; }
.facts dt { font: 500 11px/20px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts .src { font-family: var(--f-mono); font-size: 12.5px; }
.sect h3 { margin: 0 0 8px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; }
.sect h3 b { font-weight: 500; color: var(--muted); }
.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.plist button {
  width: 100%; display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center;
  text-align: left; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; background: none; border-radius: 7px; cursor: pointer;
}
.plist button:hover { background: var(--accent-soft); }
.plist .dot { width: 8px; height: 8px; border-radius: 50%; }
.plist .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .yr { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.plist .yr small { color: var(--faint); margin-left: 6px; }
/* ancestor ladder */
.ladder li { position: relative; padding-left: 14px; }
.ladder li::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.ladder li:first-child::before { top: 50%; }
.ladder li.me::before { bottom: 50%; }
.ladder li.me button { cursor: default; font-weight: 600; }
.ladder li.me button:hover { background: none; }
.ladder .dot { box-shadow: 0 0 0 2px var(--surface); position: relative; left: -15px; margin-right: -10px; }
.note { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); font-size: 13.5px; overflow-wrap: anywhere; }
.lede { margin: 0; font: 400 16px/1.55 var(--f-display); color: var(--ink); max-width: 60ch; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats b { font: 500 22px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.keys { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.keys kbd { font: 11px/18px var(--f-mono); color: var(--ink); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--raise); }
.loading { color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* dialogs: edit / suggest, editor sign-in, review queue */
.dlg {
  width: min(580px, calc(100% - 32px)); max-height: min(90vh, 920px); padding: 0; overflow: hidden auto;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  box-shadow: 0 30px 80px -30px rgba(0,0,0,.55); overscroll-behavior: contain;
}
.dlg.wide { width: min(760px, calc(100% - 32px)); }
.dlg::backdrop { background: rgba(10, 14, 12, .45); backdrop-filter: blur(2px); }
.dlg-in { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 16px; }
.dlg-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dlg-h h2 { margin: 6px 0 0; font: 500 24px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.dlg-lede { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 60ch; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin: 0; padding: 0; border: 0; min-width: 0; }
.fgrid legend { padding: 0; margin-bottom: 10px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld > span { font: 500 11px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.fld input, .fld select, .fld textarea {
  width: 100%; min-height: 36px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); outline: none;
}
.fld textarea { min-height: 88px; resize: vertical; line-height: 1.45; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fld .dirty { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 60%, var(--raise)); }
.sep { border: 0; border-top: 1px solid var(--line); margin: 0; }
.dlg-f { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
.msg { margin: 0; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; background: var(--raise); border: 1px solid var(--line); }
.msg.err { border-color: var(--accent); color: var(--accent); }
.msg.ok { border-color: var(--c2); }
.queue { display: flex; flex-direction: column; gap: 12px; }
.sg { border: 1px solid var(--line); border-radius: var(--r); background: var(--raise); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.sg-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.sg-h button { border: 0; background: none; padding: 0; cursor: pointer; font: 500 17px/1.2 var(--f-display); color: var(--ink); text-align: left; }
.sg-h button:hover { color: var(--accent); }
.sg-h small { font: 12px var(--f-mono); color: var(--muted); }
.sg.root { border: 2px solid var(--alert); box-shadow: 0 0 0 4px var(--alert-soft); }
.sg.root .eyebrow { color: var(--alert); font-weight: 600; }
.sg-h .nm-new { font: 500 17px/1.2 var(--f-display); }
.diff { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; }
.diff th { width: 26%; text-align: left; font: 500 11px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 5px 8px 5px 0; vertical-align: top; }
.diff td { padding: 4px 8px; vertical-align: top; overflow-wrap: anywhere; }
.diff .old { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.diff .new { background: var(--accent-soft); border-radius: 5px; }
.diff .none { color: var(--faint); font-style: italic; text-decoration: none; }
.sg .note { font-size: 13px; }
.sg .acts { margin: 0; justify-content: flex-end; }
@media (max-width: 560px) {
  .fgrid { grid-template-columns: 1fr; }
  .dlg-in { padding: 16px; }
  .diff th { width: 32%; }
}

@media (max-width: 760px) {
  .top { gap: 10px; }
  .search { flex: 1 1 100%; order: 3; }
  .main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .panel-in {
    padding-block: 16px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .name { font-size: 25px; }
  .legend { display: none; }
  .zoom { right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; }
  .top .btn .lbl { display: none; }
  .top .btn:not(.icon) { min-width: 34px; padding: 0 8px; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
/* print sheets: one fixed paper look (black ink on white), whatever the screen theme */
:root { --paper: #ffffff; --p-ink: #151515; --p-muted: #5a5a5a; --p-line: #8c8c8c; --p-box: #b5b5b5; --p-tint: #f2f2ef; }
.sheet { box-sizing: border-box; background: var(--paper); color: var(--p-ink); display: flex; flex-direction: column; overflow: hidden; font-family: var(--f-body); }
.sheet .ph { height: 17mm; flex: none; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; gap: 6mm; border-bottom: .3mm solid var(--p-ink); padding-bottom: 2mm; }
.sheet .pk { font: 500 2.3mm/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--p-muted); }
.sheet h1 { margin: 1.6mm 0 0; font: 500 6.2mm/1.1 var(--f-display); letter-spacing: -.01em; }
.sheet h1 span { font: 400 3.4mm var(--f-mono); color: var(--p-muted); }
.sheet .pm { font-size: 2.5mm; line-height: 1.5; color: var(--p-muted); text-align: right; }
.sheet .pbody { flex: 1; min-height: 0; padding-top: 1.5mm; }
.sheet .pf { height: 7mm; flex: none; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: space-between; gap: 4mm; font-size: 2.3mm; color: var(--p-muted); border-top: .2mm solid var(--p-box); }
.ptree { display: block; overflow: visible; }
.ptree .pl { fill: none; stroke: var(--p-line); stroke-width: .25; stroke-linecap: square; }
.ptree .pb { fill: var(--paper); stroke: var(--p-box); stroke-width: .25; }
.ptree .pb.an { fill: var(--p-tint); }
.ptree .pb.me { fill: var(--p-tint); stroke: var(--p-ink); stroke-width: .55; }
.ptree .pn { font-family: var(--f-display); font-weight: 500; fill: var(--p-ink); }
.ptree .pn.me { font-weight: 600; }
.ptree .pd { font-family: var(--f-body); fill: var(--p-muted); }
.ptree .pb.gh { fill: none; stroke-dasharray: .8 .6; }
.ptree .pd.gh { font-style: italic; }
:root { --p-bark: #5b4535; --p-leaf: #6a7a36; --p-leaf-tint: #eef1e2; --p-spouse: #8d8379; }
.otree .br { fill: none; stroke: var(--p-bark); stroke-linecap: round; }
.otree .trunk { fill: var(--p-bark); }
.otree .ground { fill: none; stroke: var(--p-bark); stroke-width: .3; stroke-linecap: round; }
.otree .lf { fill: var(--p-leaf); }
.otree .kn { fill: var(--paper); stroke: var(--p-bark); stroke-width: .35; }

let lang = 'sr';

if (!T[lang]) lang = 'sr';
const t = k => T[lang][k];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, lang === 'sr' ? '.' : ',');

const PEOPLE_COLS = 'id,ime,nadimak,prezime,rodjen,opis,mesto,supruznik,redosled,linija,istaknuto,izvor,napomena,roditelj_id,brak_id,pol';
async function loadRows() {
  const page = from => sb.from('people').select(PEOPLE_COLS, from ? {} : { count: 'exact' }).order('id').range(from, from + 999);
  const first = await page(0);
  if (first.error) throw first.error;
  const size = first.data.length, total = first.count ?? size;
  const rest = [];
  for (let from = size; size && from < total; from += size) rest.push(page(from));
  const out = first.data.slice();
  for (const r of await Promise.all(rest)) { if (r.error) throw r.error; out.push(...r.data); }
  return out;
}
let ROWS;
try { ROWS = await loadRows(); }
catch (err) {
  console.error(err);
  panelIn.innerHTML = `<p class="msg err">${esc(t('loadError'))}</p>`;
  return;
}
// the columns a visitor may suggest changes to (the database accepts no others)
const EDITABLE = ['ime', 'nadimak', 'prezime', 'rodjen', 'pol', 'opis', 'mesto', 'supruznik', 'izvor', 'napomena'];
function applyRow(p, r) {
  p.row = r;
  p.ime = r.ime || '?'; p.nad = r.nadimak || ''; p.prez = r.prezime || ''; p.god = r.rodjen; p.opis = r.opis || '';
  p.mesto = r.mesto || ''; p.sup = r.supruznik || ''; p.izv = r.izvor || ''; p.nap = r.napomena || ''; p.sex = r.pol || null;

const people = new Map();
for (const r of ROWS) {
  const p = { id: r.id, red: r.redosled || 0, lin: !!r.linija, ist: !!r.istaknuto, par: r.roditelj_id, brak: r.brak_id,
    kids: [], spouseOf: [], node: -1, size: 1, gen: 1 };
  applyRow(p, r);
  people.set(r.id, p);
}
for (const p of people.values()) {
  if (p.par != null && people.has(p.par) && p.par !== p.id) people.get(p.par).kids.push(p); else p.par = null;
  if (p.brak != null && people.has(p.brak)) people.get(p.brak).spouseOf.push(p); else p.brak = null;
}
const byOrder = (a, b) => (a.red - b.red) || (a.id - b.id);
for (const p of people.values()) p.kids.sort(byOrder);
const lineRoots = [...people.values()].filter(p => p.par == null);
(function sizes() {
  const walk = (p, g) => { p.gen = g; let s = 1; for (const k of p.kids) s += walk(k, g + 1); p.size = s; return s; };
  for (const r of lineRoots) walk(r, 1);
})();

/* surname colours: six most common surnames get a hue, the rest share a neutral */
const surCount = new Map();
for (const p of people.values()) if (p.prez && p.prez !== '?') surCount.set(p.prez, (surCount.get(p.prez) || 0) + 1);
const topSur = [...surCount.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map(e => e[0]);
const clanOf = p => { const i = topSur.indexOf(p.prez); return i < 0 ? 0 : i + 1; };

/* ---------- tree nodes (virtual root -> surname groups -> line founders -> people) ---------- */
const nodes = [];
function addNode(o) { o.i = nodes.length; o.kids = []; nodes.push(o); if (o.parent >= 0) nodes[o.parent].kids.push(o.i); return o.i; }
const ROOT = addNode({ kind: 'root', parent: -1, label: CFG.short });
// line founders with the same surname hang under one surname node; "knezevic " matches "Knežević", "Djurić" matches "Đurić"
const surKey = s => (s || '?').trim().toLowerCase().replace(/đ|dj/g, 'd').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
const groups = new Map();
for (const r of lineRoots) { const k = surKey(r.prez); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
const commonest = xs => { const c = new Map(); for (const x of xs) c.set(x, (c.get(x) || 0) + 1); return [...c.entries()].sort((a, b) => b[1] - a[1])[0][0]; };
const groupList = [...groups.values()].map(rs => ({ sur: commonest(rs.map(r => r.prez || '?')), rs: rs.sort((a, b) => (b.size - a.size) || (a.id - b.id)), size: rs.reduce((s, r) => s + r.size, 0) }))
  .sort((a, b) => b.size - a.size);
function addPerson(p, parent) {
  p.node = addNode({ kind: 'person', parent, p });
  for (const k of p.kids) addPerson(k, p.node);
}

    if (anc.length > 1) h += `<div class="sect"><h3>${esc(t('ancestors'))}<b>${anc.length - 1}</b></h3><ul class="plist ladder">${

panelIn.addEventListener('click', e => {

/* ---------- editing: visitors suggest, editors (admins table) approve ---------- */
let isAdmin = false;
const dEdit = document.getElementById('dEdit'), dLogin = document.getElementById('dLogin'), dReview = document.getElementById('dReview');
const norm = (k, v) => {
  if (v == null) return null;
  const s = String(v).trim();
  if (!s) return null;
  return k === 'rodjen' ? (/^\d+$/.test(s) ? +s : s) : s;
};
const show = v => v == null ? `<span class="none">${esc(t('empty'))}</span>` : esc(v);
const showField = (k, v) => k === 'pol' && v ? esc(t(v === 'f' ? 'sexF' : 'sexM')) : show(v);
const errText = err => (err && (err.message || err.error_description)) || String(err);
const closeBtn = `<button type="button" class="btn icon" data-close aria-label="${esc(t('close'))}">×</button>`;
// Close on the backdrop only when the press and the release both land outside the box. A drag that
// starts in a field (selecting text) and ends past its edge also fires `click` on the dialog itself.
const outsideBox = (d, e) => {
  const r = d.getBoundingClientRect();
  return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
};
for (const d of [dEdit, dLogin, dReview]) {
  let downOutside = false;
  d.addEventListener('pointerdown', e => { downOutside = e.target === d && outsideBox(d, e); });
  d.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) d.close();
    else if (e.target === d && downOutside && outsideBox(d, e)) d.close();
    downOutside = false;
  });
}
function fieldHtml(k, v) {
  const wide = k === 'supruznik' || k === 'napomena' || k === 'opis' ? ' wide' : '';
  let input;
  if (k === 'pol') input = `<select name="pol">${[['', 'sexU'], ['m', 'sexM'], ['f', 'sexF']].map(([val, l]) =>
    `<option value="${val}"${(v || '') === val ? ' selected' : ''}>${esc(t(l))}</option>`).join('')}</select>`;
  else if (k === 'napomena') input = `<textarea name="napomena" rows="4" maxlength="4000">${esc(v ?? '')}</textarea>`;
  else if (k === 'rodjen') input = `<input name="rodjen" type="number" inputmode="numeric" min="1000" max="2100" step="1" value="${esc(v ?? '')}">`;
  else input = `<input name="${k}" type="text" maxlength="300" value="${esc(v ?? '')}"${k === 'ime' ? ' required' : ''}>`;
  return `<label class="fld${wide}"><span>${esc(t('fields')[k])}</span>${input}</label>`;
}
/* child = true: the form describes a new child of p (starts empty apart from p's surname) */
function openEdit(p, child) {
  const r = child ? {} : p.row;
  const start = child ? { prezime: p.row.prezime } : r;
  const eyebrow = child ? t('childOf') : isAdmin ? t('editTitle') : t('suggestTitle');
  const lede = child ? (isAdmin ? t('childLedeAdmin') : t('childLede')) : (isAdmin ? t('editLede') : t('suggestLede'));
  dEdit.innerHTML = `<form class="dlg-in" novalidate>
    <div class="dlg-h"><div><div class="eyebrow">${dot(p)}${esc(eyebrow)}</div><h2>${fullName(p)}</h2></div>${closeBtn}</div>
    <p class="dlg-lede">${esc(lede)}</p>
    <div class="fgrid">${EDITABLE.map(k => fieldHtml(k, start[k])).join('')}</div>
    ${isAdmin ? '' : `<hr class="sep"><fieldset class="fgrid"><legend>${esc(t('about'))}</legend>
      <label class="fld"><span>${esc(t('author'))}</span><input name="_author" type="text" maxlength="100" autocomplete="name"></label>
      <label class="fld"><span>${esc(t('contact'))}</span><input name="_contact" type="text" maxlength="200" autocomplete="email"></label>
      <label class="fld wide"><span>${esc(t('comment'))}</span><textarea name="_comment" rows="3" maxlength="2000"></textarea></label>
    </fieldset>`}
    <p class="msg" role="status" hidden></p>
    <div class="dlg-f"><button type="button" class="btn" data-close>${esc(t('cancel'))}</button><button type="submit" class="btn primary">${esc(isAdmin ? t('save') : t('send'))}</button></div>
  </form>`;
  const form = dEdit.querySelector('form'), msg = form.querySelector('.msg'), submit = form.querySelector('[type=submit]');
  const say = (text, kind) => { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); msg.hidden = false; };
  const changes = () => {
    const out = {};
    for (const k of EDITABLE) if (norm(k, form.elements[k].value) !== norm(k, r[k])) out[k] = norm(k, form.elements[k].value);
    return out;
  };
  form.addEventListener('input', () => { const c = changes(); for (const k of EDITABLE) form.elements[k].classList.toggle('dirty', k in c); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const c = changes();
    if (!Object.keys(c).length) { say(t('noChange'), 'err'); return; }
    const original = child ? null : Object.fromEntries(Object.keys(c).map(k => [k, r[k] ?? null]));
    const val = n => norm('', form.elements[n] && form.elements[n].value);
    const row = { person_id: p.id, changes: c, original, author: val('_author'), contact: val('_contact'), comment: val('_comment') };
    if (child) row.kind = 'add_child';  // edits leave kind to its default
    submit.disabled = true; submit.textContent = t('sending');
    try {
      if (isAdmin) {
        const ins = await sb.from('suggestions').insert(row).select('id').single();
        if (ins.error) throw ins.error;
        await approve(ins.data.id);
        dEdit.close();
        showAdded();
      } else {
        const { error } = await sb.from('suggestions').insert(row);
        if (error) throw error;
        form.querySelectorAll('.fgrid, .sep, [type=submit]').forEach(el => el.remove());
        form.querySelector('.dlg-f [data-close]').textContent = t('close');
        say(t('thanks'), 'ok');
      }
    } catch (err) {
      console.error(err);
      say(t('failed') + errText(err), 'err');
    } finally {
      if (submit.isConnected) { submit.disabled = false; submit.textContent = isAdmin ? t('save') : t('send'); }
    }
  });
  dEdit.showModal();
  form.elements.ime.focus();
}

      <label class="fld"><span>${esc(t('author'))}</span><input name="_author" type="text" maxlength="100" autocomplete="name"></label>

  const form = dEdit.querySelector('form'), msg = form.querySelector('.msg'), submit = form.querySelector('[type=submit]');

/* approve applies the change in the database, then here: names, search and the open panel update without a reload.
   A new child changes the tree's shape, which is laid out once at load, so the page reloads onto them instead. */
let addedId = null;
async function approve(id, edited) {
  const { data, error } = await sb.rpc('approve_suggestion', edited ? { sid: id, edited } : { sid: id });
  if (error) throw error;
  const p = people.get(data.id);
  if (p) { applyRow(p, data); reindex(p); dirty = true; renderPanel(); }
  else addedId = data.id;
  refreshPending();
}
function showAdded() {
  if (addedId == null) return;
  location.hash = '#p' + addedId;
  location.reload();
}

      <label class="fld wide"><span>${esc(t('password'))}</span><input name="password" type="password" autocomplete="current-password" required></label>

async function checkAdmin() {

async function openReview() {

dReview.addEventListener('close', showAdded);
dReview.addEventListener('click', async e => {

/* ---------- print: the selected person's ancestors and everyone below them, on paper ----------
   Generations are columns (left to right). Ancestors form a straight line into the selected person;
   each parent sits on the row of its first child, so every person owns whole rows and pages break
   between rows, never through a name. Sizes are in millimetres throughout. */
const dPrint = document.getElementById('dPrint');
{
  let downOutside = false;
  dPrint.addEventListener('pointerdown', e => { downOutside = e.target === dPrint && outsideBox(dPrint, e); });
  dPrint.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) dPrint.close();
    else if (e.target === dPrint && downOutside && outsideBox(dPrint, e)) dPrint.close();
    downOutside = false;
  });
}
const PAPER = { A4: [210, 297], Letter: [215.9, 279.4], A3: [297, 420] };
const printOpts = { size: 'A4', orient: 'landscape', spouses: false, layout: 'tree', fit: false, nodes: 'pill' };  // the pill tree, unless this browser chose something else before
try { Object.assign(printOpts, JSON.parse(localStorage.getItem('stablo.print') || '{}')); } catch (e) {}
if (!PAPER[printOpts.size]) printOpts.size = 'A4';
if (printOpts.layout === 'up') printOpts.layout = 'tree';

    out.innerHTML = L.html;
    if (!pageStyle) { pageStyle = document.createElement('style'); document.head.appendChild(pageStyle); }
    pageStyle.textContent = `@page { size: ${L.pw}mm ${L.ph}mm; margin: 0; }`;
    document.body.classList.add('printing');
    dPrint.close();
    setTimeout(() => window.print(), 60);
  });
  dPrint.showModal();
  render();
}
window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing');
  const out = document.getElementById('printOut'); if (out) out.innerHTML = '';
});

/* ---------- pointer interaction ---------- */
const tip = document.getElementById('tip');
function hitTest(x, y) {
  let best = -1, bd = Infinity;
  const lz = Math.min(1.5, Math.sqrt(zoom));
  for (let i = 0; i < N; i++) {
    const s = SC[i]; if (s < 0.004) continue;
    const rad = Math.max(5, (nodes[i].kind === 'person' ? 6 : 9) * s * lz + 3);
    const dx = SX[i] - x, dy = SY[i] - y, d = dx * dx + dy * dy;
    if (d < rad * rad && d < bd) { bd = d; best = i; }
  }
  // name labels count too; where a dot and labels overlap, the person drawn largest wins
  for (const b of labelBoxes) {
    const dx = x - b.x, dy = y - b.y, c = Math.cos(b.rot), s = Math.sin(b.rot);
    const lx = dx * c + dy * s, ly = -dx * s + dy * c;
    if (lx >= b.x0 - 2 && lx <= b.x1 + 2 && ly >= b.y0 && ly <= b.y1 && (best < 0 || SC[b.i] > SC[best])) best = b.i;
  }
  return best;
}
const pointers = new Map();
let drag = null, pinch = null;
function toDisk(x, y) {
  let u = (x - cx) / R, v = (y - cy) / R; const m = Math.hypot(u, v);
  if (m > 0.95) { u *= 0.95 / m; v *= 0.95 / m; }
  return [u, v];
}
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  const [x, y] = local(e);
  pointers.set(e.pointerId, [x, y]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: zoom }; drag = null;
  } else { drag = { x, y, lx: x, ly: y, moved: false }; }
});
cv.addEventListener('pointermove', e => {
  const [x, y] = local(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [x, y]);
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    setZoom(pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / Math.max(1, pinch.d)); return;
  }
  if (drag) {
    if (!drag.moved && Math.hypot(x - drag.x, y - drag.y) > 4) { drag.moved = true; cv.classList.add('dragging'); anim = null; tip.hidden = true; }
    if (drag.moved) {
      const [u1, v1] = toDisk(drag.lx, drag.ly), [u2, v2] = toDisk(x, y);
      V = mCompose(mFromOrigin(u2, v2), mCompose(mToOrigin(u1, v1), V));
      drag.lx = x; drag.ly = y; dirty = true;
      return;
    }
  }
  if (e.pointerType === 'mouse') {
    const h = hitTest(x, y);
    if (h !== hover) { hover = h; dirty = true; cv.classList.toggle('pointing', h >= 0); }
    if (h >= 0) showTip(h, x, y); else tip.hidden = true;
  }
});
function endPointer(e) {
  const [x, y] = local(e);
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) pinch = null; drag = null; return; }
  if (drag && !drag.moved) { const h = hitTest(x, y); if (h >= 0) select(h); }
  drag = null; cv.classList.remove('dragging');
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { pointers.delete(e.pointerId); drag = null; pinch = null; cv.classList.remove('dragging'); });
cv.addEventListener('pointerleave', () => { if (hover >= 0) { hover = -1; dirty = true; } tip.hidden = true; });
cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
function setZoom(z) { zoom = Math.max(0.75, Math.min(4, z)); dirty = true; }
document.getElementById('zIn').onclick = () => setZoom(zoom * 1.3);
document.getElementById('zOut').onclick = () => setZoom(zoom / 1.3);

function showTip(i, x, y) {
  const n = nodes[i];
  let h;
  if (n.kind === 'person') {
    const p = n.p; const par = p.par != null ? people.get(p.par) : null;
    const bits = [p.god != null ? `${t('born')} ${yr(p.god)}` : '', p.opis, p.mesto].filter(Boolean).map(esc).join(' · ');
    h = `<b>${esc(plainName(p))}</b>${bits ? `<span>${bits}</span>` : ''}${par ? `<br><span>${esc(parentWord(par))}: ${esc(plainName(par))}</span>` : ''}`;
  } else if (n.kind === 'group') h = `<b>${esc(n.label)}</b><span>${esc(t('personCount')(n.group.size))} · ${esc(t('lineCount')(n.group.rs.length))}</span>`;
  else h = `<b>${esc(CFG.title)}</b>`;
  tip.innerHTML = h; tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(W - tw - 8, x + 14) + 'px';
  tip.style.top = Math.min(H - th - 8, y + 14) + 'px';
}

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]')) return;
  const inInput = e.target.matches && e.target.matches('input, textarea');
  if (e.key === '/' && !inInput) { e.preventDefault(); q.focus(); q.select(); return; }
  if (inInput || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = nodes[sel];
  const pa = n.parent;
  if (e.key === 'ArrowUp' && pa >= 0) { e.preventDefault(); select(pa); }
  else if (e.key === 'ArrowDown' && n.kids.length) { e.preventDefault(); select(n.kids[0]); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && pa >= 0) {
    e.preventDefault();
    const sib = nodes[pa].kids, k = sib.indexOf(sel);
    select(sib[(k + (e.key === 'ArrowRight' ? 1 : -1) + sib.length) % sib.length]);
  } else if (e.key === 'Home') { e.preventDefault(); select(ROOT); }
});

/* ---------- search ---------- */
const CYR = { 'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'đ','е':'e','ж':'ž','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'ć','у':'u','ф':'f','х':'h','ц':'c','ч':'č','џ':'dž','ш':'š' };
const fold = s => s.toLowerCase().replace(/[а-яђјљњћџ]/g, c => CYR[c] || c).replace(/đ/g, 'dj').normalize('NFD').replace(/[̀-ͯ]/g, '');
const foldD = s => fold(s.toLowerCase().replace(/đ/g, 'd'));
function indexEntry(p) {
  const base = [p.ime, p.nad, p.prez].join(' ');
  const hay = fold(base) + ' ' + foldD(base) + ' ' + fold(p.mesto) + ' ' + fold(p.opis) + ' ' + (p.god ?? '');
  return { p, hay, ime: fold(p.ime), ime2: foldD(p.ime), prez: fold(p.prez), prez2: foldD(p.prez), nad: foldD(p.nad) };
}
const index = [...people.values()].map(indexEntry);
function reindex(p) { const k = index.findIndex(e => e.p === p); if (k >= 0) index[k] = indexEntry(p); }
const q = document.getElementById('q'), resEl = document.getElementById('results');
let results = [], active = 0;
function runSearch() {
  const toks = fold(q.value).split(/\s+/).filter(Boolean);
  if (!toks.length) { resEl.hidden = true; results = []; return; }
  const out = [];
  for (const e of index) {
    let score = 0, ok = true;
    for (const tk of toks) {
      if (/^\d{3,4}$/.test(tk)) { if (String(e.p.god ?? '').startsWith(tk)) { score += tk.length === 4 ? 4 : 2; continue; } ok = false; break; }
      if (!e.hay.includes(tk)) { ok = false; break; }
      if (e.ime === tk || e.ime2 === tk) score += 6;
      else if (e.ime.startsWith(tk) || e.ime2.startsWith(tk)) score += 4;
      else if (e.prez.startsWith(tk) || e.prez2.startsWith(tk)) score += 3;
      else if (e.nad && e.nad.startsWith(tk)) score += 4;
      else score += 1;
    }
    if (ok) out.push([score, e.p]);
  }
  out.sort((a, b) => (b[0] - a[0]) || ((a[1].god ?? 9999) - (b[1].god ?? 9999)) || (a[1].id - b[1].id));
  results = out.slice(0, 60).map(x => x[1]); active = 0;
  renderResults(out.length);
}
function renderResults(total) {
  if (!results.length) { resEl.innerHTML = `<div class="noresults">${esc(t('noResults'))}</div>`; resEl.hidden = false; return; }
  resEl.innerHTML = `<div class="count">${esc(t('results')(total))}</div>` + results.map((p, k) => {
    const par = p.par != null ? people.get(p.par) : null;
    const ctxBits = [par ? `${parentWord(par)}: ${plainName(par)}${par.god != null ? ' (' + yr(par.god) + ')' : ''}` : t('lineRoot'), p.mesto, p.opis].filter(Boolean).join(' · ');
    return `<div class="res" role="option" id="r${k}" data-k="${k}" aria-selected="${k === active}">${dot(p)}<span class="nm">${esc(plainName(p))}</span><span class="yr">${p.god != null ? esc(yr(p.god)) : ''}</span><span class="ctx">${esc(ctxBits)}</span></div>`;
  }).join('');
  resEl.hidden = false;
}
function setActive(k) {
  if (!results.length) return;
  active = (k + results.length) % results.length;
  resEl.querySelectorAll('.res').forEach(el => el.setAttribute('aria-selected', String(+el.dataset.k === active)));
  const el = document.getElementById('r' + active); if (el) el.scrollIntoView({ block: 'nearest' });
  q.setAttribute('aria-activedescendant', 'r' + active);
}
function choose(k) { const p = results[k]; if (!p) return; resEl.hidden = true; q.blur(); select(p.node); }
q.addEventListener('input', runSearch);
q.addEventListener('focus', () => { if (q.value.trim()) runSearch(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
  else if (e.key === 'Escape') { resEl.hidden = true; q.blur(); }
});
resEl.addEventListener('pointerdown', e => { const r = e.target.closest('.res'); if (r) { e.preventDefault(); choose(+r.dataset.k); } });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) resEl.hidden = true; });

/* ---------- header, legend, language, theme ---------- */
function renderChrome() {
  document.documentElement.lang = lang === 'sr' ? 'sr-Latn' : 'en';
  document.getElementById('title').textContent = CFG.title;
  const years = [...people.values()].map(p => p.god).filter(y => y != null);
  document.getElementById('meta').textContent = `${fmt(people.size)} ${t('people')} · ${lineRoots.length} ${t('lines')} · ${Math.min(...years)}–${Math.max(...years)}`;
  q.placeholder = t('search');
  document.getElementById('lHome').textContent = t('home');
  document.getElementById('bHome').title = t('home');
  document.getElementById('lReview').textContent = t('review');
  document.getElementById('bReview').title = t('review');
  document.getElementById('bLang').textContent = lang === 'sr' ? 'EN' : 'SR';
  document.getElementById('bLang').title = t('lang');
  document.getElementById('bTheme').title = t('theme');
  document.getElementById('legend').innerHTML = topSur.map((s, k) => `<span><i style="background:var(--c${k + 1})"></i>${esc(s)}</span>`).join('') +
    `<span><i style="background:var(--c0)"></i>${esc(t('others'))}</span><span><i class="ln" style="background:var(--accent)"></i>${esc(t('pathLegend'))}</span>`;
}
document.getElementById('bLang').onclick = () => {
  lang = lang === 'sr' ? 'en' : 'sr';
  try { localStorage.setItem('stablo.lang', lang); } catch (e) {}
  renderChrome(); renderPanel(); if (q.value.trim() && !resEl.hidden) runSearch();
};
document.getElementById('bHome').onclick = () => select(ROOT);
document.getElementById('bTheme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  readColors();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- full-screen tree (?view=tree): the page that opened it gets {type: 'stablo-open', id} or {type: 'stablo-close'} ---------- */
const treebar = document.getElementById('treebar');
function renderTreebar() {
  const n = nodes[sel];
  const label = n.kind === 'person' ? `${dot(n.p)}<span class="nm">${esc(plainName(n.p))}${n.p.god != null ? `<small>${n.p.god}</small>` : ''}</span>`
    : `<span class="nm">${esc(n.kind === 'group' ? n.label : CFG.title)}</span>`;
  treebar.innerHTML = label + (n.kind === 'person' ? `<button type="button" class="btn primary" data-open="${n.p.id}">${esc(t('openPerson'))}</button>` : '') +
    `<button type="button" class="btn icon" data-close aria-label="${esc(t('closeTree'))}">×</button>`;
  treebar.hidden = false;
}
treebar.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), c = e.target.closest('[data-close]');
  if (!o && !c) return;
  const msg = o ? { type: 'stablo-open', id: +o.dataset.open } : { type: 'stablo-close' };
  if (window.parent !== window) window.parent.postMessage(msg, location.origin);
  else if (o) location.href = location.pathname + '#p' + msg.id;
});

/* ---------- boot ---------- */
new ResizeObserver(resize).observe(stage);
resize(); readColors(); renderChrome();
const wantsAdmin = location.hash === '#admin';
const m = /^#p(\d+)$/.exec(location.hash);
const g = /^#g(\d+)$/.exec(location.hash);
if (m && people.has(+m[1])) select(people.get(+m[1]).node, { instant: true });
else if (g && nodes[+g[1]] && nodes[+g[1]].kind === 'group') select(+g[1], { instant: true });
else select(ROOT, { instant: true });
// a signed-in editor gets the review button; #admin opens the sign-in (or the queue) directly
// the phone view's Print button lands here (?print=1#p…): open the print dialog, and go back to the phone
// view once it is closed or the sheets have gone to the printer
if (new URLSearchParams(location.search).has('print') && nodes[sel].kind === 'person') {
  const back = () => { if (history.length > 1) history.back(); else location.replace(location.pathname + location.hash); };
  dPrint.addEventListener('close', () => { if (!document.body.classList.contains('printing')) back(); });
  window.addEventListener('afterprint', back);
  openPrint(nodes[sel].p);
}
checkAdmin().then(ok => {
  if (ok) renderPanel();
  if (wantsAdmin) { if (ok) openReview(); else openLogin(); }
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; });
requestAnimationFrame(loop);
})();
</script>
